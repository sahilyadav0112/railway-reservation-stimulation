<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - RailBook</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="navbar"></nav>

  <main class="container narrow">
    <form id="registerForm" class="card form-card">
      <h1>Create account</h1>
      <div class="field">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label for="phone">Phone (10 digits)</label>
        <input type="tel" id="phone" required>
      </div>
      <div class="field">
        <label for="password">Password (min 6 characters)</label>
        <input type="password" id="password" required>
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" required>
      </div>
      <p id="error" class="error-text"></p>
      <button class="btn full" type="submit">Register</button>
      <p class="center muted">Already have an account? <a href="login.html">Login</a></p>
    </form>
  </main>

  <script src="js/common.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
