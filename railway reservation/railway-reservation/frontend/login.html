<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - RailBook</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="navbar"></nav>

  <main class="container narrow">
    <form id="loginForm" class="card form-card">
      <h1>Login</h1>
      <p id="success" class="notice ok" hidden>Registration successful! Please log in.</p>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <p id="error" class="error-text"></p>
      <button class="btn full" type="submit">Login</button>
      <p class="center muted">New user? <a href="register.html">Create an account</a></p>
    </form>
  </main>

  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
